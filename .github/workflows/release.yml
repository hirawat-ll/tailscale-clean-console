name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build store zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the manifest versions match
        run: |
          node -e "const c=require('./chrome/manifest.json'),f=require('./firefox/manifest.json');if(c.version!==f.version){console.error('manifest versions differ:',c.version,f.version);process.exit(1)};console.log('version',c.version)"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: ./assets/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: store-zips
          path: assets/tailscale-clean-console-*.zip
      - name: Attach zips to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: assets/tailscale-clean-console-*.zip
          generate_release_notes: true
