<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>harness</title>
<style>html,body{margin:0} iframe{width:1400px;height:1700px;border:0;display:block}</style>
</head>
<body>
<div id="flavor" style="font:12px monospace;margin:8px 8px 0"></div>
<pre id="results" style="font:12px monospace;margin:8px">running...</pre>
<iframe id="frame"></iframe>
<script>
/* Dev-only test harness: loads the mock Machines page in an iframe and drives
   the extension to assert its behavior. Used with headless Chrome --dump-dom.
   ?ext=chrome|firefox picks which extension build to load (default firefox);
   ?end=list leaves the fixture in list view for screenshots. */
const log = [];
const results = document.getElementById('results');
const frame = document.getElementById('frame');
const params = new URLSearchParams(location.search);
const end = params.get('end'); // 'list' | 'grid'
const ext = params.get('ext') === 'chrome' ? 'chrome' : 'firefox';
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function assert(name, cond) { log.push((cond ? 'PASS' : 'FAIL') + ' ' + name); }
document.getElementById('flavor').textContent = 'extension: ' + ext;
frame.src = '/admin/machines/?ext=' + ext;

let booted = false;
frame.addEventListener('load', async () => {
  const w = frame.contentWindow;
  const d = frame.contentDocument;

  /* fresh run: drop any leftover hide from a previous run of the same origin */
  if (!booted) {
    booted = true;
    w.localStorage.removeItem('tsc:settings:v1');
    w.location.reload();
    return;
  }

  const cs = (el) => w.getComputedStyle(el);

  await wait(500);

  const banner = d.querySelector('.trial-expired-notice');
  assert('banner hidden', !!banner && cs(banner).display === 'none');
  assert('html.tsc-grid on', d.documentElement.classList.contains('tsc-grid'));
  assert('table marked', !!d.querySelector('table.tsc-machines'));
  assert('title cell marked', !!d.querySelector('table.tsc-machines td.tsc-title'));
  assert('actions cell marked', !!d.querySelector('table.tsc-machines td.tsc-actions'));
  const labels = [...d.querySelectorAll('table.tsc-machines td[data-tsc-label]')].map((td) => td.getAttribute('data-tsc-label'));
  assert('last-seen label kept', labels.includes('Last Seen'));
  assert('address/version labels dropped', !labels.some((l) => /^(addresses?|ip|version)$/i.test(l)));
  assert('pill present', !!d.querySelector('#tsc-pill'));

  // first-run welcome / help card
  assert('welcome card shown on first visit', !!d.querySelector('#tsc-help'));
  assert('welcome card has one line per pill button', d.querySelectorAll('#tsc-help [data-help-line]').length === 4);
  d.querySelector('#tsc-help [data-help="dismiss"]').click();
  await wait(300);
  assert('dismiss closes the welcome card', !d.querySelector('#tsc-help'));
  const savedOn = JSON.parse(w.localStorage.getItem('tsc:settings:v1') || '{}');
  assert('dismiss saved onboarded:true', savedOn.onboarded === true);
  d.querySelector('#tsc-pill [data-act="help"]').click();
  await wait(300);
  assert('? button reopens the help card', !!d.querySelector('#tsc-help'));
  d.querySelector('#tsc-help [data-help="dismiss"]').click();
  await wait(300);
  assert('help card closes again', !d.querySelector('#tsc-help'));

  // online / offline sections
  const secOn = d.querySelector('tr.tsc-section--online');
  const secOff = d.querySelector('tr.tsc-section--offline');
  assert('online section visible', !!secOn && cs(secOn).display !== 'none');
  assert('offline section visible', !!secOff && cs(secOff).display !== 'none');
  assert('section header is a left-aligned row', cs(secOn).flexDirection === 'row' && cs(secOn).justifyContent === 'flex-start');
  const onRows = d.querySelectorAll('table.tsc-machines tbody tr.tsc-online').length;
  const offRows = d.querySelectorAll('table.tsc-machines tbody tr.tsc-offline').length;
  assert('online detected = 5', onRows === 5);
  assert('offline detected = 3', offRows === 3);
  assert('section counts correct', secOn.querySelector('.tsc-section-count').textContent === '5' && secOff.querySelector('.tsc-section-count').textContent === '3');
  assert('order: online header 0', cs(secOn).order === '0');
  assert('order: online cards 1', cs(d.querySelector('tr.tsc-online')).order === '1');
  assert('order: offline header 2', cs(secOff).order === '2');
  assert('order: offline cards 3', cs(d.querySelector('tr.tsc-offline')).order === '3');

  // addresses / version removed from the cards
  const omitted = d.querySelector('table.tsc-machines td.tsc-omit');
  assert('address+version cells marked (16)', d.querySelectorAll('table.tsc-machines td.tsc-omit').length === 16);
  assert('omitted cell hidden in grid', !!omitted && cs(omitted).display === 'none');

  d.querySelector('#tsc-pill [data-act="view"]').click();
  await wait(300);
  assert('toggle -> list: no tsc-grid', !d.documentElement.classList.contains('tsc-grid'));
  assert('toggle -> list: thead visible', cs(d.querySelector('table.tsc-machines thead')).display !== 'none');
  assert('toggle -> list: sections hidden', cs(secOn).display === 'none');
  assert('toggle -> list: omitted cells visible', cs(omitted).display !== 'none');

  d.querySelector('#tsc-pill [data-act="view"]').click();
  await wait(300);
  assert('toggle -> grid restored', d.documentElement.classList.contains('tsc-grid'));

  const target = d.querySelector('.count');
  assert('picker target exists', !!target);
  assert('no hide hint before the first hide', !d.querySelector('#tsc-hint'));
  d.querySelector('#tsc-pill [data-act="pick"]').click();
  await wait(50);
  assert('first Hide shows the device hint', !!d.querySelector('#tsc-hint'));
  const r = target.getBoundingClientRect();
  const opts = { bubbles: true, cancelable: true, clientX: r.left + 3, clientY: r.top + 3 };
  target.dispatchEvent(new w.MouseEvent('mousemove', opts));
  await wait(50);
  target.dispatchEvent(new w.MouseEvent('click', opts));
  await wait(300);
  assert('picker hid the element', cs(target).display === 'none');
  assert('hint cleared after hiding', !d.querySelector('#tsc-hint'));
  const saved = JSON.parse(w.localStorage.getItem('tsc:settings:v1') || '{}');
  assert('picker saved one selector', Array.isArray(saved.hidden) && saved.hidden.length === 1);

  // hiding a device drops it from the Online / Offline totals
  const countOf = (sel) => d.querySelector(sel + ' .tsc-section-count').textContent;
  const firstOnline = d.querySelector('tr.tsc-online');
  const devLink = firstOnline.querySelector('.name a') || firstOnline.querySelector('a');
  assert('device target exists', !!devLink);
  d.querySelector('#tsc-pill [data-act="pick"]').click();
  await wait(50);
  assert('hint shows only once', !d.querySelector('#tsc-hint'));
  const dr = devLink.getBoundingClientRect();
  const dopts = { bubbles: true, cancelable: true, clientX: dr.left + 2, clientY: dr.top + 2 };
  devLink.dispatchEvent(new w.MouseEvent('mousemove', dopts));
  await wait(50);
  devLink.dispatchEvent(new w.MouseEvent('click', dopts));
  await wait(300);
  assert('hidden device card gone', cs(firstOnline).display === 'none');
  assert('hidden device dropped from online total', countOf('tr.tsc-section--online') === '4');
  assert('hidden device left offline total alone', countOf('tr.tsc-section--offline') === '3');
  const savedDev = JSON.parse(w.localStorage.getItem('tsc:settings:v1') || '{}');
  assert('hidden device saved automatically', Array.isArray(savedDev.hiddenDevices) && savedDev.hiddenDevices.length === 1);

  d.querySelector('#tsc-pill [data-act="reset"]').click();
  await wait(300);
  assert('reset restored the element', cs(target).display !== 'none');
  assert('reset restored the hidden device', cs(firstOnline).display !== 'none');
  assert('reset restored online total', countOf('tr.tsc-section--online') === '5');

  // optional 10-second tour, launched from the help card
  d.querySelector('#tsc-pill [data-act="help"]').click();
  await wait(200);
  d.querySelector('#tsc-help [data-help="tour"]').click();
  await wait(300);
  assert('tour starts from the help card', !!d.querySelector('#tsc-tour'));
  assert('tour spotlights the Grid button', !!d.querySelector('#tsc-tour .tsc-tour-spot'));
  assert('tour shows step 1 of 2', d.querySelector('.tsc-tour-progress').textContent === '1 / 2');
  d.querySelector('#tsc-tour [data-tour="next"]').click();
  await wait(200);
  assert('tour advances to the section counts', d.querySelector('.tsc-tour-progress').textContent === '2 / 2');
  d.querySelector('#tsc-tour [data-tour="skip"]').click();
  await wait(300);
  assert('tour closes on skip', !d.querySelector('#tsc-tour'));
  assert('help card returns after the tour', !!d.querySelector('#tsc-help'));
  d.querySelector('#tsc-help [data-help="dismiss"]').click();
  await wait(200);

  // settings popover: per-item show, split reset, default view, export / import
  const firstOnlineAgain = d.querySelector('tr.tsc-online');
  const devLink2 = firstOnlineAgain.querySelector('.name a') || firstOnlineAgain.querySelector('a');
  const dname = devLink2.textContent.trim();
  d.querySelector('#tsc-pill [data-act="pick"]').click();
  await wait(50);
  const r2 = devLink2.getBoundingClientRect();
  const o2 = { bubbles: true, cancelable: true, clientX: r2.left + 2, clientY: r2.top + 2 };
  devLink2.dispatchEvent(new w.MouseEvent('mousemove', o2));
  await wait(50);
  devLink2.dispatchEvent(new w.MouseEvent('click', o2));
  await wait(300);
  assert('device hidden again for the settings test', cs(firstOnlineAgain).display === 'none');

  d.querySelector('#tsc-pill [data-act="gear"]').click();
  await wait(200);
  const st = d.querySelector('#tsc-settings');
  assert('gear opens the settings popover', !!st);
  assert('settings shows the hidden device by name', !!st && st.textContent.includes(dname));
  assert('hidden device listed with a per-item Show', !!st.querySelector('[data-settings="show-device"]'));
  assert('split reset: devices section has Show all', !!st.querySelector('[data-section="devices"] [data-settings="reset-devices"]'));
  assert('split reset: elements section has Show all', !!st.querySelector('[data-section="elements"] [data-settings="reset-elements"]'));
  assert('sync toggle is present and disabled without browser.storage', (() => { const b = st.querySelector('input[data-settings="sync"]'); return !!b && b.disabled; })());
  assert('settings offers export and import', !!st.querySelector('[data-settings="export"]') && !!st.querySelector('[data-settings="import"]'));
  assert('settings shows its schema version', st.textContent.includes('v2'));

  st.querySelector('[data-settings="show-device"]').click();
  await wait(300);
  assert('per-item Show restores the device', cs(firstOnlineAgain).display !== 'none');
  assert('restored device leaves the settings list', !d.querySelector('#tsc-settings [data-settings="show-device"]'));

  d.querySelector('#tsc-settings [data-settings="view-list"]').click();
  await wait(300);
  assert('settings can pick the default view (list)', !d.documentElement.classList.contains('tsc-grid'));
  assert('default view change is saved', JSON.parse(w.localStorage.getItem('tsc:settings:v1') || '{}').view === 'list');
  d.querySelector('#tsc-settings [data-settings="view-grid"]').click();
  await wait(300);
  assert('settings can switch back to the grid', d.documentElement.classList.contains('tsc-grid'));

  // export: capture the blob instead of downloading it
  let exported = null;
  const origCreate = w.URL.createObjectURL;
  const origAnchorClick = w.HTMLAnchorElement.prototype.click;
  w.URL.createObjectURL = (blob) => { exported = blob; return 'blob:tsc-test'; };
  w.URL.revokeObjectURL = () => {};
  w.HTMLAnchorElement.prototype.click = function () {};
  d.querySelector('#tsc-settings [data-settings="export"]').click();
  await wait(150);
  w.URL.createObjectURL = origCreate;
  w.HTMLAnchorElement.prototype.click = origAnchorClick;
  assert('export produced a JSON blob', !!exported && exported.type === 'application/json');
  let exportedJSON = null;
  try { exportedJSON = JSON.parse(exported ? await exported.text() : ''); } catch (err) {}
  assert('exported JSON carries the settings shape', !!exportedJSON && exportedJSON.schema === 2 && Array.isArray(exportedJSON.hiddenDevices));

  // import: applies the file, sanitizes fields and prunes stale device keys
  d.querySelector('#tsc-settings [data-settings="import"]').click();
  await wait(100);
  const fileInput = d.querySelector('#tsc-settings-file');
  assert('import uses a hidden file input', !!fileInput);
  const payload = JSON.stringify({ schema: 2, view: 'grid', hidden: ['.count'], hiddenDevices: ['id:nodekey02', 'id:ghost-device'], onboarded: true, hintShown: true });
  const dt = new w.DataTransfer();
  dt.items.add(new w.File([payload], 'settings.json', { type: 'application/json' }));
  fileInput.files = dt.files;
  fileInput.dispatchEvent(new w.Event('change', { bubbles: true }));
  await wait(400);
  const afterImport = JSON.parse(w.localStorage.getItem('tsc:settings:v1') || '{}');
  assert('import applied the hidden element', Array.isArray(afterImport.hidden) && afterImport.hidden.includes('.count'));
  assert('import pruned the stale device key', Array.isArray(afterImport.hiddenDevices) && afterImport.hiddenDevices.length === 1 && afterImport.hiddenDevices[0] === 'id:nodekey02');
  assert('imported hidden element is hidden on the page', cs(target).display === 'none');
  assert('imported hidden device is hidden', cs(d.querySelector('#nodekey02')).display === 'none');
  assert('import kept the schema version', afterImport.schema === 2);

  d.querySelector('#tsc-settings [data-settings="close"]').click();
  await wait(200);
  assert('close button dismisses the settings popover', !d.querySelector('#tsc-settings'));
  assert('gear loses its active state when settings close', !d.querySelector('#tsc-pill [data-act="gear"]').classList.contains('is-on'));

  w.history.pushState({}, '', '/admin/machines/some-detail');
  w.dispatchEvent(new w.PopStateEvent('popstate'));
  await wait(400);
  assert('off machines: pill removed', !d.querySelector('#tsc-pill'));
  assert('off machines: grid off', !d.documentElement.classList.contains('tsc-grid'));

  w.history.pushState({}, '', '/admin/machines/');
  w.dispatchEvent(new w.PopStateEvent('popstate'));
  await wait(400);
  assert('back on machines: pill restored', !!d.querySelector('#tsc-pill'));
  assert('back on machines: grid on', d.documentElement.classList.contains('tsc-grid'));

  if (end === 'list') {
    d.querySelector('#tsc-pill [data-act="view"]').click();
    await wait(300);
  }

  const failed = log.filter((l) => l.startsWith('FAIL')).length;
  results.textContent = log.join('\n') + '\n' + (failed ? failed + ' FAILURES' : 'ALL PASS');
  document.title = failed ? 'FAIL' : 'PASS';
});
</script>
</body>
</html>
